# Render blueprint for the server (Dashboard -> New -> Blueprint, pick this repo).
# Secrets marked "sync: false" are typed into Render's dashboard, never committed.
services:
  - type: web
    name: live-contest-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24" # npm 11 wrote the lock files; npm 10 (Node 22) rejects them in npm ci
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://live-contest.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render makes a random secret
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash,gemini-3.5-flash,gemini-3.5-flash-lite
      - key: GEMINI_QUIZ_MODEL
        value: gemini-3.5-flash-lite,gemini-3.6-flash,gemini-3.5-flash
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: GEMINI_TIMEOUT_MS
        value: "30000"
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      - key: JUDGE_CONCURRENCY
        value: "3"
